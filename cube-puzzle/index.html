<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#dfe6ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a2230" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cube Puzzle" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Cube Puzzle</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"><span id="lv">Lv1</span><span>残り矢印<strong id="count">0</strong></span></div>
  <button id="reset">↻ 新しい問題</button>
  <div id="clear" hidden>
    <p id="clear-text">クリア！</p>
    <button id="next" hidden>次のレベル</button>
  </div>
  <nav id="bar">
    <button id="pagePrev" aria-label="前の10レベル">◀</button>
    <div id="levels"></div>
    <button id="pageNext" aria-label="次の10レベル">▶</button>
  </nav>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/pwa.js"></script>
</body>
</html>
